# A schema v1 task-drive definition: each wake runs one execution of the named
# task. The shape of [drive] is satelle-server's internal/remotedef at 02e27f8
# (kind = "task" with the bare task name in task).
version = 1
provider = "fly-sprite"
satelle_version = "0.0.702"

[[repo]]
url = "https://github.com/acme/widgets.git"
ref = "main"

[drive]
kind = "task"
task = "nightly-sweep"
