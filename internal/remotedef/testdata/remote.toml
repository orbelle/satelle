# A schema v1 story-drive definition: the fixture the node join tests serve
# (internal/cli) and the bundle tests install (internal/remotenode). Its shape is
# satelle-server's internal/remotedef at 02e27f8. A test adds [setup] commands
# and [secrets.override] entries to it as it needs them.
version = 1
provider = "fly-sprite"
satelle_version = "0.0.702"

[secrets]
names = ["CLAUDE_CODE_OAUTH_TOKEN"]

[[repo]]
url = "https://github.com/acme/widgets.git"
ref = "main"

[network]
allow = ["api.example.com", "*.example.org"]

[setup]
on_create = ["host-cli setup"]

[drive]
kind = "story"
