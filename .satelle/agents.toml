[agents.executor]
command = "session"

[agents.planner]
command = "claude"
model = "claude-opus-5-5"
tools = ["Read", "Grep", "Glob"]

[agents.coder]
command = "claude"
model = "claude-opus-5-5"
tools = ["Read", "Grep", "Glob", "Edit", "Write", "Bash"]

[agents."reviewer-gemini-4-hydrogen-high"]
command = "agy"
model = "gemini-4-hydrogen-high"
tools = ["Read", "Grep", "Glob"]
