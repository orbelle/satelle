# This repo's agent bindings. A workflow names which binding performs a state
# or judges a gate. A judge's grant must be read-only and its adapter must
# enforce grants.

# The interactive session performs coding; nothing is dispatched.
[agents.executor]
command = "session"

# Planner and coder run on Opus 5.5 through Cursor (operator, 2026-11-09):
# Cursor is where model tokens and cost are allocated. The planner needs no
# shell: satelle attaches its artifact as the item's plan.
[agents.planner]
command = "pi -e /home/bobmcallan/.pi/agent/npm/node_modules/@rahularya01/pi-cursor"
model = "cursor/claude-opus-5-5"
effort = "high"
tools = ["Read", "Grep", "Glob"]

# Matches the machine's global pi-coder profile. Not wired to a state yet: the
# pi adapter refuses a Bash-granted performer until satelle's pi extension
# enforces the performer denies (sto_90945590), so in_progress stays executor.
[agents.coder]
command = "pi -e /home/bobmcallan/.pi/agent/npm/node_modules/@rahularya01/pi-cursor"
model = "cursor/claude-opus-5-5"
effort = "high"
tools = ["Read", "Bash", "Edit", "Write", "Grep", "Glob"]

[agents.reviewer]
command = "claude"
model = "sonnet"
tools = ["Read", "Grep", "Glob"]

# The gates' judge during the dogfood (operator, 2026-11-06): Gemini 3.8 flash
# on pi through the Cursor provider, the winner of the 2026-10-31 reviewer
# bake-off (old store sty_6d552f51: every defect caught, no false blocker, ~1/13
# of the runner-up's cost). grok judged the first run (sto_0586c449's plan).
[agents.reviewer-alt]
command = "pi -e /home/bobmcallan/.pi/agent/npm/node_modules/@rahularya01/pi-cursor"
model = "cursor/gemini-3.8-flash"
effort = "off"
tools = ["Read", "Grep", "Glob"]

# binary-scope's judge (operator, 2026-11-09): Gemini Flash accepted a large
# diff three times without naming a file it judged (sto_5c706973). grok, not
# Opus 5.5: binary-scope also judges the planner's plan, and the planner runs
# Opus 5.5 ([rules] reviewer_differs_from_performer; sto_49abe9f0).
[agents.reviewer-grok]
command = "grok"
tools = ["Read", "Grep", "Glob"]
