# satelle doctor's repo checks (sto_3cf973ae). doctor runs these beside its
# kernel checks, read-only; its built-in substrate check is the deterministic
# half of the drift review (sto_a1681009), so no [[check]] repeats it here. An
# [[items]] lists each open item its selection matches. See
# `satelle help configuration`.

# Open drift items: the release's drift-fix item (scripts/drift-fix.sh) lists
# every finding; it closes when a later drift review no longer finds them.
[[items]]
name = "drift"
kind = "story"
tag = "drift"
fix = "satelle story get {id}: fix what each drift-key under its Findings names; the next drift review closes it"
