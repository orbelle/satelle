# satelle doctor's repo checks (sto_3cf973ae). doctor runs these beside its
# kernel checks, read-only: a [[check]] is a check skill (exit 0 clean, 1 one
# issue per output line, anything else could not check); an [[items]] lists
# each open item its selection matches. See `satelle help configuration`.

# The deterministic drift checks: the substrate against the installed binary.
[[check]]
skill = "satelle-drift-substrate-check"
fix = "fix the line it names, or raise its drift story with scripts/drift-stories.sh (.satelle/skills/drift-review.md step 2)"

# Open drift items: each is fixed by changing what its drift-key names; the
# next drift review closes it.
[[items]]
name = "drift"
kind = "story"
tag = "drift"
fix = "satelle story get {id}: fix what its drift-key names; the next drift review closes it"
