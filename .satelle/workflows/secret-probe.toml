name = "secret-probe"

[states.backlog]
start = true

[states.done]
terminal = true

[states.cancelled]
terminal = true

[gates.change-judged]
skill = "satelle-change-judged-check"

[gates.secret-probe]
skill = "satelle-probe-secret-check"

[[transition]]
from = ["backlog"]
to = "done"
groups = [{ mode = "sequential", gates = ["change-judged", "secret-probe"] }]

[[transition]]
from = ["backlog"]
to = "cancelled"
