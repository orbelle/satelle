name = "pr-review"

# A run of the pull-request review task (.satelle/tasks/pr-review.md): one
# story's pull request head, judged cold from a checkout that is not the
# author's worktree, by a session other than the author's. The gate below
# names its judge; its publish check takes the story and the head from the
# run's tags.

[states.backlog]
start = true

[states.done]
terminal = true

[states.cancelled]
terminal = true

[gates.pr-review]
skill = "satelle-code-ac-review"
panel = ["reviewer-gemini-4-hydrogen-high"]
combine = "all"
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check", "satelle-pr-review-run-publish"]

[[transition]]
from = ["backlog"]
to = "done"
groups = [{ mode = "sequential", gates = ["pr-review"] }]

[[transition]]
from = ["*"]
to = "cancelled"
