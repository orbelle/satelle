name = "pr-review"

[states.backlog]
start = true

[states.done]
terminal = true

[states.cancelled]
terminal = true

[gates.pr-review]
skill = "satelle-code-ac-review"
panel = ["reviewer-gemini-4-hydrogen-high"]
combine = "all"
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check", "satelle-pr-review-run-publish", "satelle-gate-status-publish"]

[[transition]]
from = ["backlog"]
to = "done"
groups = [{ mode = "sequential", gates = ["pr-review"] }]

[[transition]]
from = ["*"]
to = "cancelled"
