name = "drift-node"

[states.backlog]
start = true

[states.done]
terminal = true

[states.cancelled]
terminal = true

[gates.change-judged]
skill = "satelle-change-judged-check"

[gates.drift-check]
skill = "satelle-drift-node-check"

[[transition]]
from = ["backlog"]
to = "done"
groups = [{ mode = "sequential", gates = ["change-judged", "drift-check"] }]

[[transition]]
from = ["backlog"]
to = "cancelled"
