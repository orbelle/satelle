[meta]
name = "done"
type = "workflow"
scope = "project"
create_review = "satelle-story-create-review"
amend_review = "satelle-story-amend-review"
description = "This repo's declaration of done: one table per story category listing, in order, the obligations step.toml discharges before the work closes, with `*` governing every category without its own table."

# Tables not declared here ([execution], [task]) come from the embedded declaration.

["*"]
obligations = ["raised", "readied", "coded", "integrated", "released", "closed"]
park = { state = "blocked", gate = "satelle-story-blocked-review", advisor = "blocked-triage", advisor_skill = "satelle-story-blocked-triage" }
cancel = { state = "cancelled", gate = "satelle-story-cancel-review" }
recover = [
  { step = "in_progress", from = ["integration", "release"] },
  { step = "backlog", from = ["plan"] },
]

# A chore ships nothing: it lands its tracked files on main with CI green instead of releasing.
[chore]
obligations = ["raised", "readied", "coded", "integrated", "landed", "chore-closed"]
park = { state = "blocked", gate = "satelle-story-blocked-review", advisor = "blocked-triage", advisor_skill = "satelle-story-blocked-triage" }
cancel = { state = "cancelled", gate = "satelle-story-cancel-review" }
recover = [
  { step = "in_progress", from = ["integration", "landing"] },
  { step = "backlog", from = ["plan"] },
]

# A pr story is raised as a pull request and closed by the team PR remote's merge.
[pr]
obligations = ["raised", "readied", "coded", "integrated", "pr-raised", "pr-opened", "pr-concluded", "pr-merged"]
park = { state = "blocked", gate = "satelle-story-blocked-review", advisor = "blocked-triage", advisor_skill = "satelle-story-blocked-triage" }
cancel = { state = "cancelled", gate = "satelle-story-cancel-review" }
recover = [
  { step = "in_progress", from = ["integration", "pr_raising", "pr_open", "pr_concluded"] },
  { step = "backlog", from = ["plan"] },
]

# A child's done stays on its branch; the container's done is the merge, then the release to main.
[epic-parent]
obligations = ["raised", "ready", "merged", "parent-released", "children-resolved"]
park = { state = "blocked", gate = "satelle-story-blocked-review", advisor = "blocked-triage", advisor_skill = "satelle-story-blocked-triage" }
cancel = { state = "cancelled", gate = "satelle-story-cancel-review" }
recover = [{ step = "merging", from = ["release"] }]

# Same as epic-parent: the embedded [parent] route has no release step, so it would never push to main here.
[parent]
obligations = ["raised", "ready", "merged", "parent-released", "children-resolved"]
park = { state = "blocked", gate = "satelle-story-blocked-review", advisor = "blocked-triage", advisor_skill = "satelle-story-blocked-triage" }
cancel = { state = "cancelled", gate = "satelle-story-cancel-review" }
recover = [{ step = "merging", from = ["release"] }]

# Prose-only product documentation, closed by a check that only doc paths changed.
[docs]
obligations = ["raised", "doc-authored", "docs-verified"]
park = { state = "blocked", gate = "satelle-story-blocked-review", advisor = "blocked-triage", advisor_skill = "satelle-story-blocked-triage" }
cancel = { state = "cancelled", gate = "satelle-story-cancel-review" }

[substrate]
obligations = ["raised", "authored", "substrate-verified"]
park = { state = "blocked", gate = "satelle-story-blocked-review", advisor = "blocked-triage", advisor_skill = "satelle-story-blocked-triage" }
cancel = { state = "cancelled", gate = "satelle-story-cancel-review" }
