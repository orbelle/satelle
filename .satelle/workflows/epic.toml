# A container: its children carry the work. It may not close while a child is
# open; that rule is the children-closed check, not Go.
# Children reach done only through a release run; the driving agent fires it
# per satelle-agent-goals `## Driving an epic`, then closes the epic here.
name = "epic"

[states.backlog]
start = true

[states.underway]

[states.blocked]
park = true
resumes = true

[states.done]
terminal = true

[states.cancelled]
terminal = true

[gates.children-closed]
skill = "satelle-children-closed-check"

[gates.done-review]
skill = "satelle-story-done-review"
agent = "reviewer-alt"
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[gates.blocked-review]
skill = "satelle-story-blocked-review"
agent = "reviewer-alt"
after = ["satelle-verdict-notes-check"]

[gates.cancel-review]
skill = "satelle-story-cancel-review"
agent = "reviewer-alt"
after = ["satelle-verdict-notes-check"]

[[transition]]
from = ["backlog"]
to = "underway"

[[transition]]
from = ["underway"]
to = "done"
groups = [{ mode = "sequential", gates = ["children-closed", "done-review"] }]

[[transition]]
from = ["*"]
to = "blocked"
groups = [{ mode = "sequential", gates = ["blocked-review"] }]

[[transition]]
from = ["blocked"]
to = "@prior"

[[transition]]
from = ["*", "blocked"]
to = "cancelled"
groups = [{ mode = "sequential", gates = ["children-closed", "cancel-review"] }]
