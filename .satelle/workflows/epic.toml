name = "epic"

[states.backlog]
start = true

[states.underway]

[states.blocked]
park = true
resumes = true

[states.done]
terminal = true

[states.cancelled]
terminal = true

[gates.judge-differs]
skill = "satelle-judge-differs-from-performer-check"

[gates.epic-ready]
skill = "satelle-epic-ready-review"
panel = ["reviewer-gemini-4-hydrogen-high"]
combine = "all"
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[gates.children-closed]
skill = "satelle-children-closed-check"

[gates.done-review]
skill = "satelle-story-done-review"
panel = ["reviewer-gemini-4-hydrogen-high"]
combine = "all"
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[gates.blocked-review]
skill = "satelle-story-blocked-review"
panel = ["reviewer-gemini-4-hydrogen-high"]
combine = "all"
after = ["satelle-verdict-notes-check"]

[gates.cancel-review]
skill = "satelle-story-cancel-review"
panel = ["reviewer-gemini-4-hydrogen-medium"]
combine = "all"
after = ["satelle-verdict-notes-check"]

[[transition]]
from = ["backlog"]
to = "underway"
groups = [{ mode = "sequential", gates = ["judge-differs", "epic-ready"] }]

[[transition]]
from = ["underway"]
to = "done"
groups = [{ mode = "sequential", gates = ["children-closed", "done-review"] }]

[[transition]]
from = ["*"]
to = "blocked"
groups = [{ mode = "sequential", gates = ["blocked-review"] }]

[[transition]]
from = ["blocked"]
to = "@prior"

[[transition]]
from = ["*", "blocked"]
to = "cancelled"
groups = [{ mode = "sequential", gates = ["children-closed", "cancel-review"] }]
