[meta]
name = "step"
type = "workflow"
scope = "project"
description = "This repo's step catalogue: each step is keyed by the obligation it discharges and gated on entry by its reviewers, and each [[gate]] fires on the steps and categories it names."

# Every story starts in backlog.
[raised]
status = "backlog"
start = true

# A container's readiness round: the ready-reviewer sequences its children and reports repairs satelle applies.
[ready]
status = "ready"
agent = "ready-reviewer"
skills = ["ready"]
requires = ["raised"]
waits_on_children = true
ready_children = false
mark = "ready"
propose = true
apply_changes = { ops = ["add-tags", "create-child"], tags = ["order:", "surface:", "lane:", "depends-on:", "placement:"] }
placement_tag = "placement:"
delivery_heading = "Delivery"
lane_tag = "lane:"
advise = { agent = "orchestrator", skill = "satelle-workflow-advisor" }

# A story's readiness: the planner checks the premise and plans while the story is in backlog, and the reviewers judge that plan.
[readied]
status = "plan"
agent = "planner"
skills = ["plan"]
propose = true
mark = "ready"
reject_budget = 10
reviewers = ["satelle-story-architecture-review"]
reviewer_agent = "reviewer"
parallel = 2
reviewer_carry = "until_accept"
requires = ["raised"]

# A re-presented plan that answers none of the prior blocking findings is refused before the reviewers run.
[readied.answer_progress]
enabled = true
min_progress = 1

# Plan review passes only when both seats accept; at least one runs a model
# other than the planner's.
[[gate]]
skill = "satelle-story-plan-review"
on = ["plan"]
for = ["*", "chore", "pr"]
panel = ["reviewer", "reviewer-alt"]
combine = "satelle-panel-all-accept"

# The coder implements against the frozen definition, converging with the consult seat before the gate judges cold.
[coded]
status = "in_progress"
agent = "coder"
skills = ["coder"]
freeze = true
reject_budget = 10
rework = { consult = "reviewer-consult", rounds = 5 }
apply_criteria = { doc = "plan", heading = "Acceptance criteria" }
reviewers = ["satelle-definition-unchanged-check"]
reviewer_agent = "reviewer"
requires = ["readied"]
placement_tag = "placement:"

# Code review and unit tests (in_progress → integration): one review judges the
# diff against the story's BDD and numbered ACs, scope included, and the unit
# suite runs here (satelle-build-unit-check, a [[gate]] on integration).
# Nothing performs this step: the format-vet gate covers gofmt/vet.
[integrated]
status = "integration"
reject_budget = 10
reviewers = ["satelle-ac-evidence-check", "satelle-code-ac-review"]
reviewer_agent = "reviewer"
parallel = 0
requires = ["coded"]

# Integration tests, then the outcome (integration → outcome): the integration
# suite runs first and fails fast, then the outcome review judges, per AC, that
# the integrated behaviour meets the story's BDD and ACs with integration-level
# proof. Comes before the release (and, on the pr route, before the PR).
[outcome-reviewed]
status = "outcome"
reject_budget = 10
reviewers = ["satelle-integration-check", "satelle-outcome-review"]
fail_fast = ["satelle-integration-check"]
reviewer_agent = "reviewer"
requires = ["integrated"]

[released]
status = "release"
reject_budget = 10
agent = "executor"
skills = ["release"]
reviewers = ["satelle-integration-review"]
reviewer_agent = "reviewer"
requires = ["outcome-reviewed"]

# The version-stamp check runs first, so the release review is not dispatched while the stamp is stale.
[closed]
status = "done"
reviewers = ["satelle-version-stamp-check", "satelle-story-release-review"]
reviewer_agent = "reviewer"
terminal = true
reject_budget = 10
requires = ["released"]
advise = { agent = "retrospective", skill = "satelle-lessons" }

# A chore lands its tracked files on main without a version bump or changelog entry.
[landed]
status = "landing"
agent = "executor"
skills = ["land"]
requires = ["integrated"]

[chore-closed]
status = "done"
reviewers = ["satelle-chore-landed-check"]
reviewer_agent = "reviewer"
terminal = true
reject_budget = 10
requires = ["landed"]
advise = { agent = "retrospective", skill = "satelle-lessons" }

# A pr story is pushed on epic/<id> and opened as a pull request; main is never committed to here.
[pr-raised]
status = "pr_raising"
agent = "executor"
skills = ["raise-pr"]
reviewers = ["satelle-integration-review"]
reviewer_agent = "reviewer"
reject_budget = 10
requires = ["outcome-reviewed"]

# The team PR remote is woken for the story and its run is waited on; nothing performs locally.
[pr-opened]
status = "pr_open"
agent = "pr-remote"
reviewers = ["satelle-pr-open-check"]
reviewer_agent = "reviewer"
reject_budget = 10
requires = ["pr-raised"]

# The remote run's conclusion picks the edge: accepted closes, denied returns to in_progress, stopped parks.
[pr-concluded]
status = "pr_concluded"
remote_wait = { remote = "rmt_c9ecdce8d1ba", on ={ accept = "done", reject = "in_progress", stopped = "blocked" } }
requires = ["pr-opened"]

[pr-merged]
status = "done"
reviewers = ["satelle-pr-merged-check"]
reviewer_agent = "reviewer"
terminal = true
reject_budget = 10
requires = ["pr-concluded"]
advise = { agent = "retrospective", skill = "satelle-lessons" }

# Merges every integrated child's epic branch; it neither bumps .version nor pushes.
[merged]
status = "merging"
agent = "executor"
skills = ["merge-epic"]
after_children = "integrated"
requires = ["ready"]

# The container's release is the push to main and the version bump.
[parent-released]
status = "release"
agent = "executor"
skills = ["release"]
requires = ["merged"]

[children-resolved]
status = "done"
agent = "reviewer"
reviewers = ["satelle-story-done-review"]
terminal = true
reject_budget = 10
requires = ["parent-released"]
advise = { agent = "retrospective", skill = "satelle-epic-retrospective" }

# Docs authoring has its own step so it does not inherit the substrate rubric on [authored].
[doc-authored]
status = "in_progress"
agent = "executor"
requires = ["raised"]

[docs-verified]
status = "done"
reviewers = ["satelle-docs-only-check"]
terminal = true
reject_budget = 10
requires = ["doc-authored"]

[authored]
status = "in_progress"
agent = "executor"
skills = ["substrate"]
requires = ["raised"]
placement_tag = "placement:"

[substrate-verified]
status = "done"
terminal = true
reject_budget = 10
requires = ["authored"]

[run]
status = "in_progress"
agent = "executor"
skills = ["task-run"]
reject_budget = 10
reviewers = ["satelle-task-validate-before-review"]
reviewer_agent = "reviewer"
requires = ["raised"]

[run-verified]
status = "done"
reviewers = ["satelle-task-validate-after-review"]
reviewer_agent = "reviewer"
terminal = true
reject_budget = 10
requires = ["run"]

[[gate]]
skill = "satelle-step-summary"
agent = "reviewer-summary"
mandatory = true
for = ["*", "docs", "epic-parent", "parent", "substrate", "chore", "pr"]

[[gate]]
skill = "satelle-estimate-actual-review"
on = ["in_progress", "done"]
for = ["*", "chore", "pr"]

[[gate]]
skill = "satelle-format-vet-check"
on = ["integration"]
for = ["*", "chore", "pr"]

[[gate]]
skill = "satelle-build-unit-check"
on = ["integration"]
for = ["*", "chore", "pr"]

# The integration suite runs once, in this gate, so a chore runs it on entry to landing.
[[gate]]
skill = "satelle-integration-check"
on = ["landing"]
for = ["chore"]

[[gate]]
skill = "satelle-ci-published-check"
on = ["done"]
for = ["*"]

[[gate]]
skill = "satelle-dogfood-check"
on = ["done"]
for = ["*"]

[[gate]]
skill = "satelle-changelog-entry-check"
on = ["done"]
for = ["*"]

# A container member not tagged lane:trunk closes only once its slice is on a pushed epic/<id> branch not yet on trunk.
[[gate]]
skill = "satelle-epic-branch-check"
on = ["done"]
for = ["*"]

[[gate]]
skill = "satelle-design-review"
agent = "reviewer"
on = ["integration"]
applies_to = ["surface:ui"]
for = ["*", "chore", "pr"]

[[gate]]
skill = "satelle-substrate-only-check"
on = ["done"]
for = ["substrate"]


# Judges added or rewritten instruction text, run only when the trigger check says the change is more than whitespace.
[[gate]]
skill = "satelle-instruction-change-review"
agent = "reviewer"
when = "satelle-instruction-change-trigger"
on = ["integration", "done"]
for = ["*", "docs", "substrate", "execution", "task", "chore", "pr"]

# Judges route edits, run only when the change set touches a workflow file.
[[gate]]
skill = "satelle-workflow-change-review"
agent = "reviewer"
when = "satelle-workflow-change-trigger"
on = ["integration"]
for = ["*", "chore", "pr"]
