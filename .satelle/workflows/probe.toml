name = "probe"

[states.backlog]
start = true

[states.done]
terminal = true

[states.cancelled]
terminal = true

[gates.change-judged]
skill = "satelle-change-judged-check"

[gates.probe-version]
skill = "satelle-probe-version-check"

[[transition]]
from = ["backlog"]
to = "done"
groups = [{ mode = "sequential", gates = ["change-judged", "probe-version"] }]

[[transition]]
from = ["backlog"]
to = "cancelled"
