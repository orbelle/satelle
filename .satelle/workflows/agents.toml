# The roles this repo's routes name; each seat's execution detail comes from the machine catalog (~/.satelle/agents.toml) via agents.local.toml.

# The one in-loop driving session.
[executor]
role       = "agent"
command    = "in-loop"
effort     = "high"
principles = "session"

# Implements the coded step; never advances status.
[coder]
role         = "agent"
principles   = "session"
busy_timeout = "60m"

# Read-only gate reviewer.
[reviewer]
role       = "reviewer"
principles = "session"

# Second plan-review panel seat (reviewer-alt). The panel must hold at least one
# model other than the planner's; a same-model seat beside it is fine.
[reviewer-alt]
role       = "reviewer"
principles = "session"

# Read-only live consult seat for the coded step's rework relay.
[reviewer-consult]
role       = "reviewer"
principles = "session"

# Container readiness performer; reports story repairs, edits no product files.
[ready-reviewer]
role       = "agent"
principles = "session"

# The team PR-approval remote (satelle-pr project, Satelle workspace; definition
# remotes/pr-approve, sty_8a03f28d); tools = "Read" only satisfies the
# context-channel check, as nothing dispatches here.
[pr-remote]
role      = "agent"
placement = "team:rmt_c9ecdce8d1ba"
# The remote is runner-backed, so a wake must name its declared request trigger
# (sty_1f6e6667, sty_e82e141f).
trigger   = "pr-approve-request"
tools     = "Read"

[reviewer-summary]
role       = "reviewer"
principles = "session"

# Read-only planner for the readied step.
[planner]
role       = "agent"
principles = "session"

[retrospective]
role       = "agent"
principles = "session"

# Consulted on park to blocked; never dispatched to mutate.
[blocked-triage]
role       = "agent"
principles = "session"

# The order an unset model follows, per executable.
[model_order]
claude = ["opus", "sonnet", "haiku"]
