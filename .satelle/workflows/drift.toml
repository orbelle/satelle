name = "drift"
panel = "Drift"

[states.open]
start = true
waits = "a drift review run (release.md step 11) that no longer finds its keys"

[states.done]
terminal = true

[states.cancelled]
terminal = true

[gates.drift-resolved]
skill = "satelle-drift-resolved-check"

[gates.change-judged]
skill = "satelle-change-judged-check"

[gates.cancel-review]
skill = "satelle-story-cancel-review"
panel = ["reviewer-gemini-4-argon-high"]
combine = "all"
after = ["satelle-verdict-notes-check"]

[[transition]]
from = ["open"]
to = "done"
groups = [{ mode = "sequential", gates = ["change-judged", "drift-resolved"] }]

[[transition]]
from = ["*"]
to = "cancelled"
groups = [{ mode = "sequential", gates = ["cancel-review"] }]
