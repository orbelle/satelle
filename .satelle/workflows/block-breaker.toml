name = "block-breaker"

[states.backlog]
start = true

[states.break_claude]
performer = { agent = "planner", skill = "block-breaker" }
edits = "attachments"

[states.break_gemini]
performer = { agent = "reviewer-gemini-3.8-flash-high", skill = "block-breaker" }
edits = "attachments"

[states.break_grok]
performer = { agent = "reviewer-grok-4.7", skill = "block-breaker" }
edits = "attachments"

[states.break_gpt]
performer = { agent = "reviewer-gpt-5.6-sol-high", skill = "block-breaker" }
edits = "attachments"

[states.done]
terminal = true

[states.cancelled]
terminal = true

[gates.validate-before]
skill = "satelle-task-validate-before-review"

[gates.change-judged]
skill = "satelle-change-judged-check"

[gates.block-resolution]
skill = "satelle-block-resolution-check"

[gates.cancel-review]
skill = "satelle-story-cancel-review"
agent = "reviewer-gemini-3.8-flash-high"
after = ["satelle-verdict-notes-check"]

[gates.cancel-review-grok]
skill = "satelle-story-cancel-review"
agent = "reviewer-grok-4.7"
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[[transition]]
from = ["backlog"]
to = "break_claude"
groups = [{ mode = "sequential", gates = ["validate-before"] }]

[[transition]]
from = ["backlog"]
to = "break_gemini"
groups = [{ mode = "sequential", gates = ["validate-before"] }]

[[transition]]
from = ["backlog"]
to = "break_grok"
groups = [{ mode = "sequential", gates = ["validate-before"] }]

[[transition]]
from = ["backlog"]
to = "break_gpt"
groups = [{ mode = "sequential", gates = ["validate-before"] }]

[[transition]]
from = ["break_claude", "break_gemini", "break_grok", "break_gpt"]
to = "done"
groups = [{ mode = "sequential", gates = ["change-judged", "block-resolution"] }]

[[transition]]
from = ["backlog", "break_claude", "break_grok", "break_gpt"]
to = "cancelled"
groups = [{ mode = "sequential", gates = ["cancel-review"] }]

[[transition]]
from = ["break_gemini"]
to = "cancelled"
groups = [{ mode = "sequential", gates = ["cancel-review-grok"] }]
