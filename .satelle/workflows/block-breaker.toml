name = "block-breaker"

[states.backlog]
start = true

[states.break_claude]
performer = { agent = "planner", skill = "block-breaker" }
edits = "attachments"

[states.done]
terminal = true

[states.cancelled]
terminal = true

[gates.validate-before]
skill = "satelle-task-validate-before-review"

[gates.change-judged]
skill = "satelle-change-judged-check"

[gates.block-resolution]
skill = "satelle-block-resolution-check"

[gates.cancel-review]
skill = "satelle-story-cancel-review"
panel = ["reviewer-gemini-4-hydrogen-medium"]
combine = "all"
after = ["satelle-verdict-notes-check"]

[[transition]]
from = ["backlog"]
to = "break_claude"
groups = [{ mode = "sequential", gates = ["validate-before"] }]

[[transition]]
from = ["break_claude"]
to = "done"
groups = [{ mode = "sequential", gates = ["change-judged", "block-resolution"] }]

[[transition]]
from = ["backlog", "break_claude"]
to = "cancelled"
groups = [{ mode = "sequential", gates = ["cancel-review"] }]
