name = "substrate"

[states.backlog]
start = true

[states.in_progress]
performer = { agent = "executor", skill = "substrate" }
hold = { rounds = 3, to = "blocked" }

[states.blocked]
park = true
resumes = true

[states.done]
terminal = true

[states.cancelled]
terminal = true

[gates.substrate-paths]
skill = "satelle-substrate-paths-check"

[gates.substrate-validate]
skill = "satelle-substrate-validate-check"

[gates.judge-differs]
skill = "satelle-judge-differs-from-performer-check"

[gates.volatile-literals]
skill = "satelle-volatile-literal-check"

[gates.workflow-change]
skill = "satelle-workflow-change-review"
panel = ["reviewer-gemini-4-neon-high"]
combine = "all"
trigger = "satelle-workflow-change-trigger"
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[gates.reference-review]
skill = "satelle-reference-review"
panel = ["reviewer-gemini-4-hydrogen-high"]
combine = "all"
carry = true
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[gates.blocked-review]
skill = "satelle-story-blocked-review"
panel = ["reviewer-gemini-4-hydrogen-high"]
combine = "all"
after = ["satelle-verdict-notes-check"]

[gates.cancel-review]
skill = "satelle-story-cancel-review"
panel = ["reviewer-gemini-4-hydrogen-medium"]
combine = "all"
after = ["satelle-verdict-notes-check"]

[[transition]]
from = ["backlog"]
to = "in_progress"

[[transition]]
from = ["in_progress"]
to = "done"
groups = [
  { mode = "sequential", gates = ["substrate-paths", "substrate-validate", "judge-differs", "volatile-literals"] },
  { mode = "sequential", gates = ["workflow-change", "reference-review"] },
]

[[transition]]
from = ["in_progress"]
to = "blocked"

[[transition]]
from = ["backlog"]
to = "blocked"
groups = [{ mode = "sequential", gates = ["blocked-review"] }]

[[transition]]
from = ["blocked"]
to = "@prior"

[[transition]]
from = ["*", "blocked"]
to = "cancelled"
groups = [{ mode = "sequential", gates = ["cancel-review"] }]
