# A run of a task (an execution): perform the task's skill over the items it
# took, then judge the result. Merging and releasing completed work is a task
# whose executions follow this route.
name = "runbook"

[states.backlog]
start = true

[states.in_progress]
performer = { agent = "executor", skill = "task-run" }

[states.done]
terminal = true

[states.cancelled]
terminal = true

[gates.validate-before]
skill = "satelle-task-validate-before-review"

[gates.validate-after]
skill = "satelle-task-validate-after-review"
agent = "reviewer-alt"
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

# A run that landed items (release.md step 4 attaches its kept list as
# release-kept before the push) is refused done while any of them is not in a
# terminal state of its own workflow. A run with no release-kept landed
# nothing, so the check accepts every other run. First in its group: cheap,
# and it fails before the reviewer is spent.
[gates.release-kept]
skill = "satelle-release-kept-check"

# The drift review run (release.md step 11) only: the trigger skips every
# other run. drift-constitution judges the release's binary change, its diff
# from the previous release tag over the binary's sources and the
# constitution and principles (an edit to those is how a constitution finding
# gets fixed), against the constitution and principles; its after check holds
# an accept of a diff the prompt cut to READ lines for each hidden file.
# drift-claims judges the principles' statements of mechanism against the
# released source; .version changes on every release, so it is relevant to
# every drift run. Both judges state a RESOLVED line for each open drift
# finding of their kind that no longer holds. drift-closures checks the run's
# drift-report lists of closed and stayed-open drift stories (drift-review.md
# step 4) against the kernel.
[gates.drift-constitution]
skill = "satelle-drift-constitution-review"
# GPT-5.6 Sol (operator, 2026-11-10; sto_ac7edb34): Gemini 3.8 Flash High gave
# reasonless verdicts twice on v1.0.51's drift review (exe_877db7d1).
agent = "reviewer-gpt"
trigger = "satelle-drift-run-trigger"
paths = ["cmd/**", "internal/**", "go.mod", "go.sum", ".satelle/constitution.md", ".satelle/principles/**"]
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check", "satelle-drift-diff-covered"]

[gates.drift-claims]
skill = "satelle-drift-claims-review"
# GPT-5.6 Sol (operator, 2026-11-10; sto_ac7edb34): Gemini 3.8 Flash High gave
# reasonless verdicts twice on v1.0.51's drift review (exe_877db7d1).
agent = "reviewer-gpt"
trigger = "satelle-drift-run-trigger"
paths = [".version"]
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[gates.drift-closures]
skill = "satelle-drift-closures-check"
trigger = "satelle-drift-run-trigger"

[[transition]]
from = ["backlog"]
to = "in_progress"
groups = [{ mode = "sequential", gates = ["validate-before"] }]

[[transition]]
from = ["in_progress"]
to = "done"
groups = [{ mode = "sequential", gates = ["release-kept", "drift-constitution", "drift-claims", "drift-closures", "validate-after"] }]

[[transition]]
from = ["*"]
to = "cancelled"
