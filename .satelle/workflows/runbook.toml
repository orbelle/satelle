# A run of a task (an execution): perform the task's skill over the items it
# took, then judge the result. Merging and releasing completed work is a task
# whose executions follow this route.
name = "runbook"

[states.backlog]
start = true

[states.in_progress]
performer = { agent = "executor", skill = "task-run" }

[states.done]
terminal = true

[states.cancelled]
terminal = true

[gates.validate-before]
skill = "satelle-task-validate-before-review"

[gates.validate-after]
skill = "satelle-task-validate-after-review"
agent = "reviewer-alt"

# The drift review run (release.md step 11) only: the trigger skips every
# other run. drift-constitution judges the release's binary change, its diff
# from the previous release tag over the binary's sources, against the
# constitution and principles; its after check holds an accept of a diff the
# prompt cut to READ lines for each hidden file. drift-claims judges the
# principles' statements of mechanism against the released source; .version
# changes on every release, so it is relevant to every drift run.
[gates.drift-constitution]
skill = "satelle-drift-constitution-review"
agent = "reviewer"
trigger = "satelle-drift-run-trigger"
after = "satelle-drift-diff-covered"
paths = ["cmd/**", "internal/**", "go.mod", "go.sum"]

[gates.drift-claims]
skill = "satelle-drift-claims-review"
agent = "reviewer"
trigger = "satelle-drift-run-trigger"
paths = [".version"]

[[transition]]
from = ["backlog"]
to = "in_progress"
groups = [{ mode = "sequential", gates = ["validate-before"] }]

[[transition]]
from = ["in_progress"]
to = "done"
groups = [{ mode = "sequential", gates = ["drift-constitution", "drift-claims", "validate-after"] }]

[[transition]]
from = ["*"]
to = "cancelled"
