name = "chore"

[states.backlog]
start = true
hold = { rounds = 3, to = "blocked" }

[states.in_progress]
performer = { agent = "coder", skill = "coder" }
hold = { rounds = 3, to = "blocked" }

[states.integration]
hold = { rounds = 3, to = "blocked" }

[states.in_review]

[states.approved]
enqueue = ["release"]

[states.blocked]
park = true
resumes = true

[states.done]
terminal = true

[states.cancelled]
terminal = true

[gates.story-review]
skill = "satelle-story-review"
panel = ["reviewer-gemini-4-hydrogen-high"]
combine = "all"
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[gates.constitution]
skill = "satelle-constitution-review"
panel = ["reviewer-gemini-4-hydrogen-high"]
combine = "all"
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[gates.risk-assess]
skill = "satelle-risk-assess-review"
panel = ["reviewer-gemini-4-hydrogen-medium"]
combine = "all"
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check", "satelle-risk-tier-record"]

[gates.security]
skill = "satelle-security-review"
panel = ["reviewer-gemini-4-hydrogen-high", "reviewer-grok-4.7"]
combine = "all"
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[gates.judge-differs]
skill = "satelle-judge-differs-from-performer-check"

[gates.format-vet]
skill = "satelle-format-vet-check"
carry = true

[gates.build-unit]
skill = "satelle-build-unit-check"
carry = true

[gates.workflow-change]
skill = "satelle-workflow-change-review"
panel = ["reviewer-gemini-4-hydrogen-high"]
combine = "all"
trigger = "satelle-workflow-change-trigger"
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[gates.code-ac]
skill = "satelle-code-ac-review"
panel = ["reviewer-gemini-4-hydrogen-high", "reviewer-grok-4.7"]
combine = "all"
carry = true
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[gates.integration-check]
skill = "satelle-integration-check"
timeout = "40m"

[gates.pr-pending]
skill = "satelle-gate-status-publish"

[gates.pr-ready]
skill = "satelle-pr-ready-check"
after = ["satelle-gate-status-publish"]

[gates.pr-review]
skill = "satelle-pr-approve-from-review"
after = ["satelle-gate-status-publish"]

[gates.pr-approval]
skill = "satelle-pr-approval-check"
after = ["satelle-gate-status-publish"]

[gates.change-judged]
skill = "satelle-change-judged-check"

[gates.release-run]
skill = "satelle-release-run-check"

[gates.version-stamp]
skill = "satelle-version-stamp-check"

[gates.changelog-entry]
skill = "satelle-changelog-entry-check"

[gates.ci-published]
skill = "satelle-ci-published-check"

[gates.release-installed]
skill = "satelle-release-installed-check"

[gates.blocked-review]
skill = "satelle-story-blocked-review"
panel = ["reviewer-gemini-4-hydrogen-high"]
combine = "all"
after = ["satelle-verdict-notes-check"]

[gates.cancel-review]
skill = "satelle-story-cancel-review"
panel = ["reviewer-gemini-4-hydrogen-medium"]
combine = "all"
after = ["satelle-verdict-notes-check"]

[[transition]]
from = ["backlog"]
to = "in_progress"
groups = [{ mode = "sequential", gates = ["story-review", "risk-assess"] }]

[[transition]]
from = ["in_progress"]
to = "integration"
groups = [
  { mode = "sequential", gates = ["judge-differs", "format-vet", "build-unit"] },
  { mode = "sequential", gates = ["security", "constitution", "workflow-change"] },
  { mode = "parallel", gates = ["code-ac"] },
]

[[transition]]
from = ["integration"]
to = "in_review"
groups = [{ mode = "sequential", gates = ["pr-pending", "integration-check", "pr-ready", "pr-review"] }]

[[transition]]
from = ["in_review"]
to = "approved"
groups = [{ mode = "sequential", gates = ["pr-approval"] }]

[[transition]]
from = ["approved"]
to = "done"
groups = [{ mode = "sequential", gates = ["change-judged", "release-run", "version-stamp", "changelog-entry", "ci-published", "release-installed"] }]

[[transition]]
from = ["integration", "in_review", "approved"]
to = "in_progress"

[[transition]]
from = ["backlog", "in_progress", "integration", "in_review"]
to = "blocked"

[[transition]]
from = ["approved"]
to = "blocked"
groups = [{ mode = "sequential", gates = ["blocked-review"] }]

[[transition]]
from = ["blocked"]
to = "@prior"

[[transition]]
from = ["*", "blocked"]
to = "cancelled"
groups = [{ mode = "sequential", gates = ["cancel-review"] }]
