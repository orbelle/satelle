# A chore: code without a plan stage, end DEV at approved (an open, approved
# pull request), and reach done only through a run of the release task, as a
# delivery story does.
name = "chore"

[states.backlog]
start = true

# Every review has the plan's round cap (operator, 2026-11-13: "all review
# processes should have the same process as planner"): after 3 rejected rounds
# in a row leaving a state, the item is blocked for the operator with the
# dissent as its reason, instead of looping on the same reviewers.
[states.in_progress]
performer = { agent = "executor", skill = "coder" }
hold = { rounds = 3, to = "blocked" }

[states.integration]
hold = { rounds = 3, to = "blocked" }

# DEV ends here; a run of the release task takes the item.
[states.approved]
# Reaching approved adds the story to the release queue (fired by hand in
# release step 0); the queue is .satelle/queues/release.toml.
enqueue = ["release"]

[states.blocked]
park = true
resumes = true

[states.done]
terminal = true

[states.cancelled]
terminal = true

[gates.binary-scope]
skill = "satelle-binary-scope-review"
agent = "reviewer-grok-4.7"
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[gates.format-vet]
skill = "satelle-format-vet-check"
carry = true

[gates.build-unit]
skill = "satelle-build-unit-check"
carry = true

# Gemini and GPT-5.6 Sol judge the code; both must accept (operator,
# 2026-11-10; sto_0dd7e7b9).
[gates.code-ac]
skill = "satelle-code-ac-review"
panel = ["reviewer-gemini-3.8-flash-high", "reviewer-gpt-5.6-sol-high"]
combine = "all"
carry = true
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

# On a node of the docker-local remote integration, against the pushed head
# (sto_da5c52e7); the timeout bounds the whole node run.
[gates.integration-check]
skill = "satelle-integration-check"
placement = "remote:integration"
timeout = "40m"

[gates.pr-ready]
skill = "satelle-pr-ready-check"

# PR review by the satelle GitHub app (sto_ebcaa5aa), on integration -> approved
# after pr-ready (sto_efe81afd): approval is the satelle app's review on the
# head. pr-review is the code-ac judge; its after publishes the verdict on the
# PR head as satelle[bot] and, on a reject, attaches it as pr-review and
# reopens the item. pr-approval passes only on the app's approving review on
# the head.
[gates.pr-review]
skill = "satelle-code-ac-review"
agent = "reviewer-gemini-3.8-flash-high"
carry = true
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check", "satelle-pr-review-publish"]

[gates.pr-approval]
skill = "satelle-pr-approval-check"

# A terminal state is reached only with a change a judge accepted (sto_e2cec5df).
# The rule was the binary's; it is this check now (sto_035f3007), first on
# approved -> done, which has no judge of its own, so a commit made after
# code-ac fails here before release-run reads release state.
[gates.change-judged]
skill = "satelle-change-judged-check"

[gates.release-run]
skill = "satelle-release-run-check"

[gates.version-stamp]
skill = "satelle-version-stamp-check"

[gates.changelog-entry]
skill = "satelle-changelog-entry-check"

[gates.ci-published]
skill = "satelle-ci-published-check"

[gates.release-installed]
skill = "satelle-release-installed-check"

[gates.blocked-review]
skill = "satelle-story-blocked-review"
agent = "reviewer-gemini-3.8-flash-high"
after = ["satelle-verdict-notes-check"]

[gates.cancel-review]
skill = "satelle-story-cancel-review"
agent = "reviewer-gemini-3.8-flash-high"
after = ["satelle-verdict-notes-check"]

[[transition]]
from = ["backlog"]
to = "in_progress"

[[transition]]
from = ["in_progress"]
to = "integration"
groups = [
  { mode = "sequential", gates = ["binary-scope", "format-vet", "build-unit"] },
  { mode = "parallel", gates = ["code-ac"] },
]

[[transition]]
from = ["integration"]
to = "approved"
groups = [{ mode = "sequential", gates = ["integration-check", "pr-ready", "pr-review", "pr-approval"] }]

[[transition]]
from = ["approved"]
to = "done"
groups = [{ mode = "sequential", gates = ["change-judged", "release-run", "version-stamp", "changelog-entry", "ci-published", "release-installed"] }]

[[transition]]
from = ["integration", "approved"]
to = "in_progress"

# The review caps' moves: gateless, so a cap cannot itself be rejected; the
# dissent summary is the reason. Only the operator moves it out.
[[transition]]
from = ["in_progress", "integration"]
to = "blocked"

# Every other move into blocked is judged: the reason must hold.
[[transition]]
from = ["backlog", "approved"]
to = "blocked"
groups = [{ mode = "sequential", gates = ["blocked-review"] }]

[[transition]]
from = ["blocked"]
to = "@prior"

[[transition]]
from = ["*", "blocked"]
to = "cancelled"
groups = [{ mode = "sequential", gates = ["cancel-review"] }]
