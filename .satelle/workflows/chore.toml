name = "chore"

[states.backlog]
start = true
hold = { rounds = 3, to = "blocked" }

[states.in_progress]
performer = { agent = "executor", skill = "coder" }
hold = { rounds = 3, to = "blocked" }

[states.integration]
hold = { rounds = 3, to = "blocked" }

[states.approved]
enqueue = ["release"]

[states.blocked]
park = true
resumes = true

[states.done]
terminal = true

[states.cancelled]
terminal = true

[gates.story-review]
skill = "satelle-story-review"
agent = "reviewer-gemini-3.8-flash-high"
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[gates.binary-scope]
skill = "satelle-binary-scope-review"
agent = "reviewer-grok-4.7"
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[gates.format-vet]
skill = "satelle-format-vet-check"
carry = true

[gates.build-unit]
skill = "satelle-build-unit-check"
carry = true

[gates.code-ac]
skill = "satelle-code-ac-review"
panel = ["reviewer-gpt-5.6-sol-high"]
combine = "all"
carry = true
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[gates.integration-check]
skill = "satelle-integration-check"
placement = "remote:integration"
timeout = "40m"

# Posts pending for satelle/pr-ready, satelle/pr-review and satelle/pr-approval
# on the head before any other gate of the presentation (the status skill's
# gates= line names them).
[gates.pr-pending]
skill = "satelle-gate-status-publish"

[gates.pr-ready]
skill = "satelle-pr-ready-check"
# The status entry is last so it posts the result as it finally stands.
after = ["satelle-gate-status-publish"]

[gates.pr-review]
skill = "satelle-code-ac-review"
agent = "reviewer-gemini-3.8-flash-high"
carry = true
# The review publish check stays before the status entry, so a verdict the
# reasons rules refuse is not published as a review; the status entry is last
# so it posts the result as it finally stands.
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check", "satelle-pr-review-publish", "satelle-gate-status-publish"]

[gates.pr-approval]
skill = "satelle-pr-approval-check"
# The status entry is last so it posts the result as it finally stands.
after = ["satelle-gate-status-publish"]

[gates.change-judged]
skill = "satelle-change-judged-check"

[gates.release-run]
skill = "satelle-release-run-check"

[gates.version-stamp]
skill = "satelle-version-stamp-check"

[gates.changelog-entry]
skill = "satelle-changelog-entry-check"

[gates.ci-published]
skill = "satelle-ci-published-check"

[gates.release-installed]
skill = "satelle-release-installed-check"

[gates.blocked-review]
skill = "satelle-story-blocked-review"
agent = "reviewer-gemini-3.8-flash-high"
after = ["satelle-verdict-notes-check"]

[gates.cancel-review]
skill = "satelle-story-cancel-review"
agent = "reviewer-gemini-3.8-flash-high"
after = ["satelle-verdict-notes-check"]

[[transition]]
from = ["backlog"]
to = "in_progress"
groups = [{ mode = "sequential", gates = ["story-review"] }]

[[transition]]
from = ["in_progress"]
to = "integration"
groups = [
  { mode = "sequential", gates = ["binary-scope", "format-vet", "build-unit"] },
  { mode = "parallel", gates = ["code-ac"] },
]

[[transition]]
from = ["integration"]
to = "approved"
groups = [{ mode = "sequential", gates = ["pr-pending", "integration-check", "pr-ready", "pr-review", "pr-approval"] }]

[[transition]]
from = ["approved"]
to = "done"
groups = [{ mode = "sequential", gates = ["change-judged", "release-run", "version-stamp", "changelog-entry", "ci-published", "release-installed"] }]

[[transition]]
from = ["integration", "approved"]
to = "in_progress"

[[transition]]
from = ["backlog", "in_progress", "integration"]
to = "blocked"

[[transition]]
from = ["approved"]
to = "blocked"
groups = [{ mode = "sequential", gates = ["blocked-review"] }]

[[transition]]
from = ["blocked"]
to = "@prior"

[[transition]]
from = ["*", "blocked"]
to = "cancelled"
groups = [{ mode = "sequential", gates = ["cancel-review"] }]
