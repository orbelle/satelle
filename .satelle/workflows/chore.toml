# A chore: code without a plan stage, end the agent's DEV at confirm (an open,
# approved pull request with a generated result summary), move on only on the
# operator's word (approved, or back to in_progress), and reach done only
# through a run of the release task, as a delivery story does (sto_9f1303b3).
name = "chore"

[states.backlog]
start = true

[states.in_progress]
performer = { agent = "executor", skill = "coder" }

[states.integration]

# The agent's DEV ends here, with the result summary attached; the operator's
# word (satelled's Awaiting-you page) names the move: approved or in_progress.
[states.confirm]
performer = { operator = "confirmation" }

# Confirmed by the operator; a run of the release task takes the item.
[states.approved]
# Reaching approved adds the story to the release queue (fired by hand in
# release step 0); the queue is .satelle/queues/release.toml.
enqueue = ["release"]

[states.blocked]
park = true
resumes = true

[states.done]
terminal = true

[states.cancelled]
terminal = true

[gates.binary-scope]
skill = "satelle-binary-scope-review"
agent = "reviewer-alt"

[gates.format-vet]
skill = "satelle-format-vet-check"
carry = true

[gates.build-unit]
skill = "satelle-build-unit-check"
carry = true

[gates.code-ac]
skill = "satelle-code-ac-review"
agent = "reviewer-alt"
carry = true

# On a node of the docker-local remote integration, against the pushed head
# (sto_da5c52e7); the timeout bounds the whole node run.
[gates.integration-check]
skill = "satelle-integration-check"
placement = "remote:integration"
timeout = "40m"

[gates.pr-ready]
skill = "satelle-pr-ready-check"

# PR review by the satelle GitHub app (sto_ebcaa5aa), on integration -> confirm
# after pr-ready (sto_efe81afd): approval is the satelle app's review on the
# head. pr-review is the code-ac judge; its after publishes the verdict on the
# PR head as satelle[bot] and, on a reject, attaches it as pr-review and
# reopens the item. pr-approval passes only on the app's approving review on
# the head.
[gates.pr-review]
skill = "satelle-code-ac-review"
agent = "reviewer-alt"
carry = true
after = "satelle-pr-review-publish"

[gates.pr-approval]
skill = "satelle-pr-approval-check"

# The operator's result summary (sto_9f1303b3): last on integration -> confirm,
# so it runs only once every earlier gate of the move accepted. It composes
# the changes, every gate verdict, the evidence and the coder's how-to into
# result-summary (text/markdown; type=brief) and rejects when it cannot. No
# carry: it is regenerated on every entry.
[gates.result-summary]
skill = "satelle-result-summary"

[gates.release-run]
skill = "satelle-release-run-check"

[gates.version-stamp]
skill = "satelle-version-stamp-check"

[gates.changelog-entry]
skill = "satelle-changelog-entry-check"

[gates.ci-published]
skill = "satelle-ci-published-check"

[gates.release-installed]
skill = "satelle-release-installed-check"

[gates.blocked-review]
skill = "satelle-story-blocked-review"
agent = "reviewer-alt"

[gates.cancel-review]
skill = "satelle-story-cancel-review"
agent = "reviewer-alt"

[[transition]]
from = ["backlog"]
to = "in_progress"

[[transition]]
from = ["in_progress"]
to = "integration"
groups = [
  { mode = "sequential", gates = ["binary-scope", "format-vet", "build-unit"] },
  { mode = "parallel", gates = ["code-ac"] },
]

[[transition]]
from = ["integration"]
to = "confirm"
groups = [{ mode = "sequential", gates = ["integration-check", "pr-ready", "pr-review", "pr-approval", "result-summary"] }]

# The operator's word picks one of these, and only it: gateless, since the
# operator judged it (the kernel holds the move to the record).
[[transition]]
from = ["confirm"]
to = "approved"

[[transition]]
from = ["confirm"]
to = "in_progress"

[[transition]]
from = ["approved"]
to = "done"
groups = [{ mode = "sequential", gates = ["release-run", "version-stamp", "changelog-entry", "ci-published", "release-installed"] }]

[[transition]]
from = ["integration", "approved"]
to = "in_progress"

[[transition]]
from = ["*"]
to = "blocked"
groups = [{ mode = "sequential", gates = ["blocked-review"] }]

[[transition]]
from = ["blocked"]
to = "@prior"

[[transition]]
from = ["*", "blocked"]
to = "cancelled"
groups = [{ mode = "sequential", gates = ["cancel-review"] }]
