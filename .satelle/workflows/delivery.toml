name = "delivery"

[states.backlog]
start = true
hold = { rounds = 3, to = "blocked" }

[states.plan]
performer = { agent = "planner", skill = "plan" }
edits = "attachments"
hold = { rounds = 3, to = "blocked" }

[states.in_progress]
performer = { agent = "executor", skill = "coder" }
hold = { rounds = 3, to = "blocked" }

[states.integration]
hold = { rounds = 3, to = "blocked" }

[states.in_review]
waits = "the pull-request review task (.satelle/tasks/pr-review.md), run for the item by a session other than the author's"

[states.approved]
enqueue = ["release"]

[states.blocked]
park = true
resumes = true

[states.done]
terminal = true

[states.cancelled]
terminal = true

[gates.binary-scope]
skill = "satelle-binary-scope-review"
panel = ["reviewer-gemini-4-hydrogen-high"]
combine = "all"
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[gates.story-review]
skill = "satelle-story-review"
panel = ["reviewer-gemini-4-hydrogen-high"]
combine = "all"
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[gates.architecture]
skill = "satelle-story-architecture-review"
panel = ["reviewer-gemini-4-hydrogen-high"]
combine = "all"
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[gates.risk-assess]
skill = "satelle-risk-assess-review"
panel = ["reviewer-gemini-4-hydrogen-high"]
combine = "all"
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check", "satelle-risk-tier-record"]

[gates.security]
skill = "satelle-security-review"
panel = ["reviewer-gemini-4-hydrogen-high"]
combine = "all"
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[gates.plan-review]
skill = "satelle-story-plan-review"
panel = ["reviewer-gemini-4-hydrogen-high"]
combine = "all"
carry = true
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[gates.definition-unchanged]
skill = "satelle-definition-unchanged-check"

[gates.judge-differs]
skill = "satelle-judge-differs-from-performer-check"

[gates.tree-unchanged]
skill = "satelle-tree-unchanged-check"

[gates.plan-touches]
skill = "satelle-plan-touches-check"

[gates.format-vet]
skill = "satelle-format-vet-check"
carry = true

[gates.build-unit]
skill = "satelle-build-unit-check"
carry = true

[gates.instruction-change]
skill = "satelle-instruction-change-review"
panel = ["reviewer-gemini-4-hydrogen-high"]
combine = "all"
trigger = "satelle-instruction-change-trigger"
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[gates.workflow-change]
skill = "satelle-workflow-change-review"
panel = ["reviewer-gemini-4-hydrogen-high"]
combine = "all"
trigger = "satelle-workflow-change-trigger"
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[gates.ac-evidence]
skill = "satelle-ac-evidence-check"

[gates.code-ac]
skill = "satelle-code-ac-review"
panel = ["reviewer-gemini-4-neon-high"]
combine = "all"
carry = true
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[gates.integration-check]
skill = "satelle-integration-check"
placement = "remote:integration"
timeout = "40m"

[gates.pr-pending]
skill = "satelle-gate-status-publish"

[gates.pr-ready]
skill = "satelle-pr-ready-check"
after = ["satelle-gate-status-publish"]

[gates.pr-approval]
skill = "satelle-pr-approval-check"
after = ["satelle-gate-status-publish"]

[gates.change-judged]
skill = "satelle-change-judged-check"

[gates.release-run]
skill = "satelle-release-run-check"

[gates.version-stamp]
skill = "satelle-version-stamp-check"

[gates.changelog-entry]
skill = "satelle-changelog-entry-check"

[gates.ci-published]
skill = "satelle-ci-published-check"

[gates.release-installed]
skill = "satelle-release-installed-check"

[gates.outcome-review]
skill = "satelle-outcome-review"
panel = ["reviewer-gemini-4-hydrogen-high"]
combine = "all"
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[gates.done-review]
skill = "satelle-story-done-review"
panel = ["reviewer-gemini-4-hydrogen-high"]
combine = "all"
after = ["satelle-verdict-notes-check", "satelle-verdict-reference-check"]

[gates.blocked-review]
skill = "satelle-story-blocked-review"
panel = ["reviewer-gemini-4-hydrogen-high"]
combine = "all"
after = ["satelle-verdict-notes-check"]

[gates.cancel-review]
skill = "satelle-story-cancel-review"
panel = ["reviewer-gemini-4-hydrogen-high"]
combine = "all"
after = ["satelle-verdict-notes-check"]

[[transition]]
from = ["backlog"]
to = "plan"
groups = [{ mode = "sequential", gates = ["story-review"] }]

[[transition]]
from = ["plan"]
to = "in_progress"
groups = [
  { mode = "sequential", gates = ["tree-unchanged", "plan-touches", "binary-scope", "risk-assess", "security", "plan-review"] },
]

[[transition]]
from = ["in_progress"]
to = "integration"
groups = [
  { mode = "sequential", gates = ["definition-unchanged", "judge-differs", "format-vet", "build-unit"] },
  { mode = "sequential", gates = ["binary-scope", "security"] },
  { mode = "sequential", gates = ["code-ac"] },
]

[[transition]]
from = ["integration"]
to = "in_review"
groups = [
  { mode = "sequential", gates = ["pr-pending", "integration-check", "pr-ready"] },
]

[[transition]]
from = ["in_review"]
to = "approved"
groups = [
  { mode = "sequential", gates = ["pr-approval"] },
]

[[transition]]
from = ["approved"]
to = "done"
groups = [
  { mode = "sequential", gates = ["change-judged", "release-run", "version-stamp", "changelog-entry", "ci-published", "release-installed"] },
]

[[transition]]
from = ["integration", "in_review", "approved"]
to = "in_progress"

[[transition]]
from = ["in_progress"]
to = "plan"

[[transition]]
from = ["backlog", "plan", "in_progress", "integration", "in_review"]
to = "blocked"

[[transition]]
from = ["approved"]
to = "blocked"
groups = [{ mode = "sequential", gates = ["blocked-review"] }]

[[transition]]
from = ["blocked"]
to = "@prior"

[[transition]]
from = ["*"]
to = "cancelled"
groups = [{ mode = "sequential", gates = ["cancel-review"] }]

[[transition]]
from = ["blocked"]
to = "cancelled"
groups = [{ mode = "sequential", gates = ["cancel-review"] }]
