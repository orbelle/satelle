# This repo's route for a story: plan, code, integrate, judge the outcome.
# Merging and releasing completed work is a task (see release.toml), not a step.
name = "delivery"

[states.backlog]
start = true

[states.plan]
performer = { agent = "planner", skill = "plan" }

[states.in_progress]
performer = { agent = "executor", skill = "coder" }

[states.integration]

[states.assessment]

[states.blocked]
park = true
resumes = true

[states.done]
terminal = true

[states.cancelled]
terminal = true

# ---- gates ----

# sty_7c477116: rejects any plan that adds or extends process in Go, with no
# exemption; first in its group so it fails fast; judges the diff again before
# integration.
#
# Reviewer backoff (operator, 2026-11-06): during the dogfood the model gates
# run on one judge, the alt reviewer, and only binary-scope, plan-review and
# code-ac are wired. Deterministic checks stay. Paused gates (architecture,
# instruction-change, workflow-change, ac-evidence, outcome-review,
# done-review) and the second plan-review judge come back one at a time, after
# each run shows the current set holds.
[gates.binary-scope]
skill = "satelle-binary-scope-review"
agent = "reviewer-alt"

[gates.architecture]
skill = "satelle-story-architecture-review"
agent = "reviewer-alt"

[gates.plan-review]
skill = "satelle-story-plan-review"
# Quality over speed (operator, 2026-11-06): grok found the one real plan flaw
# on sto_0586c449, so it judges plans beside Gemini; both must accept.
# Interim until sto_cdf94c34 (judges get attachments): Gemini on pi reads only
# the repo, so it cannot see an attached plan and rejects every plan as missing
# (sto_fa7df85b, 2026-11-06). grok judges plans alone until then; restore
# panel = ["reviewer-alt", "reviewer-grok"], combine = "all" when it lands.
agent = "reviewer-grok"
carry = true

[gates.definition-unchanged]
skill = "satelle-definition-unchanged-check"

[gates.format-vet]
skill = "satelle-format-vet-check"
paths = ["**/*.go"]
carry = true

[gates.build-unit]
skill = "satelle-build-unit-check"
paths = ["**/*.go", "go.mod", "go.sum"]
carry = true

[gates.instruction-change]
skill = "satelle-instruction-change-review"
agent = "reviewer-alt"
trigger = "satelle-instruction-change-trigger"

[gates.workflow-change]
skill = "satelle-workflow-change-review"
agent = "reviewer-alt"
trigger = "satelle-workflow-change-trigger"

[gates.ac-evidence]
skill = "satelle-ac-evidence-check"

[gates.code-ac]
skill = "satelle-code-ac-review"
agent = "reviewer-alt"
carry = true

[gates.integration-check]
skill = "satelle-integration-check"

[gates.outcome-review]
skill = "satelle-outcome-review"
agent = "reviewer-alt"

[gates.done-review]
skill = "satelle-story-done-review"
agent = "reviewer-alt"

[gates.blocked-review]
skill = "satelle-story-blocked-review"
agent = "reviewer-alt"

[gates.cancel-review]
skill = "satelle-story-cancel-review"
agent = "reviewer-alt"

# ---- transitions ----

[[transition]]
from = ["backlog"]
to = "plan"

[[transition]]
from = ["plan"]
to = "in_progress"
groups = [
  { mode = "sequential", gates = ["binary-scope", "plan-review"] },
]

[[transition]]
from = ["in_progress"]
to = "integration"
groups = [
  { mode = "sequential", gates = ["definition-unchanged", "binary-scope"] },
]

[[transition]]
from = ["integration"]
to = "assessment"
groups = [
  { mode = "sequential", gates = ["format-vet", "build-unit"] },
  { mode = "sequential", gates = ["code-ac"] },
]

[[transition]]
from = ["assessment"]
to = "done"
groups = [
  { mode = "sequential", gates = ["integration-check"] },
]

# Rework: back to coding from any judging state, and back to planning.
[[transition]]
from = ["integration", "assessment"]
to = "in_progress"

[[transition]]
from = ["in_progress"]
to = "plan"

[[transition]]
from = ["*"]
to = "blocked"
groups = [{ mode = "sequential", gates = ["blocked-review"] }]

[[transition]]
from = ["blocked"]
to = "@prior"

[[transition]]
from = ["*"]
to = "cancelled"
groups = [{ mode = "sequential", gates = ["cancel-review"] }]

[[transition]]
from = ["blocked"]
to = "cancelled"
groups = [{ mode = "sequential", gates = ["cancel-review"] }]
