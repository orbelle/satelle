# This repo's route for a story. DEV: plan, code, integrate, and end at
# confirm (tested locally, pushed, an open pull request, approved, with a
# generated result summary). The operator's word moves it on: to approved
# (confirmed) or back to in_progress (sent back with the reason) (sto_9f1303b3).
# CI/CD: a run of the release task takes the approved items, builds one
# candidate from their heads (fast-forward or merge, in queue order), tests it
# once, bumps the version once on top, fast-forwards main to it, releases and
# installs, and only then moves them to done
# (operator, 2026-11-06; modelled on satelle-server's delivery.toml).
name = "delivery"

[states.backlog]
start = true
# The human's start (sto_33a25a76; operator ruling 2026-11-07, the outer
# loop): a story enters development only on the operator's recorded go, which
# names the move (plan; blocked or cancelled too, since every exit needs it).
# The operator records it from their own terminal (satelle story record <id>
# --to plan --file F) or on satelled's Awaiting-you page; the driving session
# then presents that move. After it nothing asks the operator until confirm.
performer = { operator = "go" }

[states.plan]
performer = { agent = "planner", skill = "plan" }
# Round cap (sto_216e2027): plan review was rejected 8 rounds running on one
# dissenter (satelle-server sto_7094c283). After 3 rejected rounds in a row the
# item is held for the operator instead of re-planned; 3 is the plan skill's
# own attempt budget.
hold = { rounds = 3, to = "held" }

[states.in_progress]
performer = { agent = "executor", skill = "coder" }

[states.integration]

# The agent's DEV ends here: an open, approved pull request whose head is
# tested and contains main, and the result summary (result-summary, typed
# brief) attached. The operator reads it on satelled's Awaiting-you page (or
# with satelle story attachment) and records their word, naming the move:
# approved (confirm) or in_progress (send back, with the reason). Only that
# move leaves; the driving session presents it (sto_9f1303b3).
[states.confirm]
performer = { operator = "confirmation" }

# Confirmed by the operator. A run of the release task takes the item; a
# release run that cannot land it sends it back to in_progress with the
# reason, and it returns through confirm.
[states.approved]
# Reaching approved adds the story to the release queue (fired by hand in
# release step 0); the queue is .satelle/queues/release.toml.
enqueue = ["release"]

[states.blocked]
park = true
resumes = true

# Where a state's round cap holds an item for the operator. Only the operator
# moves it out (held -> @prior, or cancelled); the driving session stops.
[states.held]
park = true
resumes = true

[states.done]
terminal = true

[states.cancelled]
terminal = true

# ---- gates ----

# sty_7c477116: rejects any plan that adds or extends process in Go, with no
# exemption; first in its group so it fails fast; judges the diff again before
# integration.
#
# Reviewer backoff (operator, 2026-11-06): during the dogfood the model gates
# run on one judge, the alt reviewer, and only binary-scope, plan-review and
# code-ac are wired. Deterministic checks stay. Paused gates (architecture,
# instruction-change, workflow-change, ac-evidence, outcome-review,
# done-review) and the second plan-review judge come back one at a time, after
# each run shows the current set holds.
[gates.binary-scope]
skill = "satelle-binary-scope-review"
agent = "reviewer-alt"

[gates.architecture]
skill = "satelle-story-architecture-review"
agent = "reviewer-alt"

[gates.plan-review]
skill = "satelle-story-plan-review"
# Quality over speed (operator, 2026-11-06): grok found the one real plan flaw
# on sto_0586c449, so it judges plans beside Gemini; both must accept. Judges
# read the attached plan from the item's record folder (sto_cdf94c34).
panel = ["reviewer-alt", "reviewer-grok"]
combine = "all"
carry = true

[gates.definition-unchanged]
skill = "satelle-definition-unchanged-check"

[gates.format-vet]
skill = "satelle-format-vet-check"
carry = true

[gates.build-unit]
skill = "satelle-build-unit-check"
carry = true

[gates.instruction-change]
skill = "satelle-instruction-change-review"
agent = "reviewer-alt"
trigger = "satelle-instruction-change-trigger"

[gates.workflow-change]
skill = "satelle-workflow-change-review"
agent = "reviewer-alt"
trigger = "satelle-workflow-change-trigger"

[gates.ac-evidence]
skill = "satelle-ac-evidence-check"

[gates.code-ac]
skill = "satelle-code-ac-review"
agent = "reviewer-alt"
carry = true

# The full local suite, once, on the head that will be released (GitHub runs
# no tests; operator, 2026-11-06). It runs on a node of the docker-local
# remote integration (.satelle/remotes/integration), against the pushed head,
# so stories' suites run at once (sto_da5c52e7); the timeout bounds the whole
# node run: start, setup, fetch and make test.
[gates.integration-check]
skill = "satelle-integration-check"
placement = "remote:integration"
timeout = "40m"

# The agent's DEV, on its way to confirm: the head is committed, pushed, contains origin/main and has an
# open pull request against main. Readiness only: it does not approve; the
# satelle GitHub app's review (pr-review, pr-approval) decides after it.
[gates.pr-ready]
skill = "satelle-pr-ready-check"

# PR review by the satelle GitHub app (sto_ebcaa5aa), on integration -> confirm
# after pr-ready (sto_efe81afd): approval is the satelle app's review on the
# head. pr-review is the code-ac judge; its after publishes the verdict on the
# PR head as satelle[bot] and, on a reject, attaches it as pr-review and
# reopens the item. pr-approval passes only on the app's approving review on
# the head.
[gates.pr-review]
skill = "satelle-code-ac-review"
agent = "reviewer-alt"
carry = true
after = "satelle-pr-review-publish"

[gates.pr-approval]
skill = "satelle-pr-approval-check"

# The operator's result summary (sto_9f1303b3): last on integration -> confirm,
# so it runs only once every earlier gate of the move accepted. It composes
# the changes, every gate verdict, the evidence and the coder's how-to into
# result-summary (text/markdown; type=brief) and rejects when it cannot. No
# carry: it is regenerated on every entry.
[gates.result-summary]
skill = "satelle-result-summary"

# CI/CD's gates on approved -> done, all reading origin/main: only a run of the
# release task closes an item, after the bump, the release and the install.
[gates.release-run]
skill = "satelle-release-run-check"

[gates.version-stamp]
skill = "satelle-version-stamp-check"

[gates.changelog-entry]
skill = "satelle-changelog-entry-check"

[gates.ci-published]
skill = "satelle-ci-published-check"

[gates.release-installed]
skill = "satelle-release-installed-check"

[gates.outcome-review]
skill = "satelle-outcome-review"
agent = "reviewer-alt"

[gates.done-review]
skill = "satelle-story-done-review"
agent = "reviewer-alt"

[gates.blocked-review]
skill = "satelle-story-blocked-review"
agent = "reviewer-alt"

[gates.cancel-review]
skill = "satelle-story-cancel-review"
agent = "reviewer-alt"

# ---- transitions ----

[[transition]]
from = ["backlog"]
to = "plan"

[[transition]]
from = ["plan"]
to = "in_progress"
groups = [
  { mode = "sequential", gates = ["binary-scope", "plan-review"] },
]

[[transition]]
from = ["in_progress"]
to = "integration"
groups = [
  { mode = "sequential", gates = ["definition-unchanged", "binary-scope", "format-vet", "build-unit"] },
  { mode = "sequential", gates = ["code-ac"] },
]

[[transition]]
from = ["integration"]
to = "confirm"
groups = [
  { mode = "sequential", gates = ["integration-check", "pr-ready", "pr-review", "pr-approval", "result-summary"] },
]

# The operator's word picks one of these, and only it: gateless, since the
# operator judged it (the kernel holds the move to the record).
[[transition]]
from = ["confirm"]
to = "approved"

[[transition]]
from = ["confirm"]
to = "in_progress"

[[transition]]
from = ["approved"]
to = "done"
groups = [
  { mode = "sequential", gates = ["release-run", "version-stamp", "changelog-entry", "ci-published", "release-installed"] },
]

# Rework: back to coding from integration, or from approved when a release run
# cannot land the item (it records why on the item); and back to planning. A
# send-back from confirm is the operator's own move above.
[[transition]]
from = ["integration", "approved"]
to = "in_progress"

[[transition]]
from = ["in_progress"]
to = "plan"

# The hold's move: gateless, so the hold cannot itself be rejected.
[[transition]]
from = ["plan"]
to = "held"

[[transition]]
from = ["held"]
to = "@prior"

[[transition]]
from = ["*"]
to = "blocked"
groups = [{ mode = "sequential", gates = ["blocked-review"] }]

[[transition]]
from = ["blocked"]
to = "@prior"

[[transition]]
from = ["*"]
to = "cancelled"
groups = [{ mode = "sequential", gates = ["cancel-review"] }]

[[transition]]
from = ["blocked", "held"]
to = "cancelled"
groups = [{ mode = "sequential", gates = ["cancel-review"] }]
