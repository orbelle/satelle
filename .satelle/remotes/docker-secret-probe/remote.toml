version = 1
name = "docker-secret-probe"
provider = "docker-local"
satelle_version = "1.0.123"

[secrets]
names = ["SATELLE_PROBE_SECRET"]

[drive]
kind = "task"
task = "tas_caaacb22"

[setup]
on_create = ["printf %s \"$SATELLE_PROBE_SECRET\" | sha256sum | cut -d' ' -f1 > \"$HOME/.satelle-secret-probe-setup.sha256\""]

[lifecycle]
scope = "run"
