# satelle's own CI/CD remote, schema v1 (sty_8094a272): the CI/CD half of the
# delivery path, the same shape as satelle-server's remotes/cicd. DEV runs
# locally up to an outcome-reviewed story whose epic/<id> (or feat/<id>) branch
# is pushed with its CHANGELOG entry under "## [Unreleased]". Each wake of this
# remote runs one execution of tasks/tsk_release.md for the story it is handed:
# from a writable clone of orbelle/satelle it runs
# .satelle/remotes/satelle-cicd/release.sh, which stamps the release on the story
# branch, opens the story's PR, approves it under the operator's gh token (the
# PR's author; satelle pr approve posts the satelle/pr-approval status), merges
# it, and waits for CI and the v<version> tag. Dogfood stays on the operator's
# machine. A personal remote: owner_only in the satelle project of the owner's
# personal workspace, so it reads the owner's personal secrets.
version = 1
name = "satelle-cicd"
provider = "fly-sprite"
satelle_version = "0.0.891"
environment = "prd"

[drive]
kind = "task"
task = "release"

# The owner's personal secrets, which the node's satelle hands to its agent
# bindings and so to the executor's shell: GH_TOKEN to clone, push, open, approve
# and merge the PR and watch CI (the operator's identity, the PR's author); the
# OpenRouter key for the pi bindings. They move to [env] when satelle accepts it
# (sty_85c8e0d6, sty_fc50e4d0), as a change to this definition.
[secrets.override]
GH_TOKEN = "satelle:GITHUB_TOKEN"
OPENROUTER_API_KEY = "satelle:OPENROUTER_API_KEY"

# The first line holds a Sprites task so the VM does not warm-pause in a quiet
# stretch (release.sh waits on CI): with no heartbeat the node is declared lost
# (nod_859d2073cc74, nod_50febea9e82d). satelle-server's workaround until its
# sty_d77543a5 ships; it talks to the local unix socket, so it needs no egress.
# Then pi (from its GitHub release, as satelle-server's smoke remote installs it)
# for the bindings; gh for the PR and the CI watch; Go for
# scripts/check-serve-version.sh, which derives the satelled watch set with go list.
# `command -v pi` names the pi the bindings run: a sprite's base image may carry
# its own pi ahead of ~/.local/bin on PATH.
[setup]
on_create = [
  "nohup sh -c 'while :; do curl -s --unix-socket /.sprite/api.sock -H \"Content-Type: application/json\" -X PUT http://sprite/v1/tasks/satelle-node -d \"{\\\"expire\\\":\\\"5m\\\"}\" >/dev/null 2>&1; sleep 60; done' >/dev/null 2>&1 &",
  "mkdir -p $HOME/.local/share $HOME/.local/bin && curl -fsSL https://github.com/earendil-works/pi/releases/download/v1.5.0/pi-linux-x64.tar.gz | tar -xz -C $HOME/.local/share && ln -sf $HOME/.local/share/pi/pi $HOME/.local/bin/pi",
  "mkdir -p $HOME/.local/share $HOME/.local/bin && curl -fsSL https://github.com/cli/cli/releases/download/v2.103.3/gh_2.103.3_linux_amd64.tar.gz | tar -xz -C $HOME/.local/share && ln -sf $HOME/.local/share/gh_2.103.3_linux_amd64/bin/gh $HOME/.local/bin/gh",
  "curl -fsSL https://dl.google.com/go/go1.27.0.linux-amd64.tar.gz | tar -xz -C $HOME/.local/share && ln -sf $HOME/.local/share/go/bin/go $HOME/.local/bin/go && ln -sf $HOME/.local/share/go/bin/gofmt $HOME/.local/bin/gofmt",
  "satelle version",
  "command -v pi && pi --version",
  "gh --version",
  "go version",
  "git --version",
]

[network]
allow = ["openrouter.ai", "github.com", "api.github.com", "codeload.github.com", "objects.githubusercontent.com", "release-assets.githubusercontent.com", "satelle.dev", "dl.google.com", "proxy.golang.org", "sum.golang.org", "storage.googleapis.com"]

[lifecycle]
scope = "run"
