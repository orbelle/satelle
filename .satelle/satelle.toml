# This repo's satelle settings (kernel schema). An unknown key refuses to run.

[workflows]
default = "delivery"

# First match wins.
[[workflows.rule]]
workflow = "runbook"
kind = "execution"

[[workflows.rule]]
workflow = "standing"
kind = "task"

[[workflows.rule]]
workflow = "standing"
kind = "queue"

[[workflows.rule]]
workflow = "epic"
tag = "epic"

# A drift item (the release's drift-fix item, scripts/drift-fix.sh) is a record
# that closes only when each finding is carried or no longer found; before
# chore, since the fix item is a chore too.
[[workflows.rule]]
workflow = "drift"
kind = "story"
tag = "drift"

[[workflows.rule]]
workflow = "chore"
category = "chore"

[gate]
edit_exempt_paths = [".satelle/**", ".claude/**", ".grok/**", ".gitignore"]

[hook]
inject = [".satelle/principles/satelle-agent-goals.md", ".satelle/principles/satelle-operator-rulings.md", ".satelle/skills/satelle-workflow-standard.md"]

[rules]
reviewer_differs_from_performer = true
