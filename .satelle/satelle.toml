[workflows]
default = "delivery"

[[workflows.rule]]
workflow = "block-breaker"
kind = "execution"
tag = "block-breaker"

[[workflows.rule]]
workflow = "runbook"
kind = "execution"

[[workflows.rule]]
workflow = "standing"
kind = "task"

[[workflows.rule]]
workflow = "standing"
kind = "queue"

[[workflows.rule]]
workflow = "cross-repo"
tag = "cross-repo"

[[workflows.rule]]
workflow = "epic"
tag = "epic"

[[workflows.rule]]
workflow = "drift"
kind = "story"
tag = "drift"

[[workflows.rule]]
workflow = "substrate"
category = "substrate"

[[workflows.rule]]
workflow = "chore"
category = "chore"

[gate]
edit_exempt_paths = [".claude/**", ".grok/**", ".gitignore"]

[hook]
inject = [".satelle/principles/satelle-agent-goals.md", ".satelle/principles/satelle-reference-not-restate.md", ".satelle/skills/satelle-workflow-standard.md"]

[review]
tier_tag = "risk"

[review.panels.code-ac]
low = ["reviewer-gemini-4-hydrogen-high"]
high = ["reviewer-gemini-4-hydrogen-high", "reviewer-grok-4.7"]

[review.panels.security]
low = ["reviewer-gemini-4-hydrogen-high"]
high = ["reviewer-gemini-4-hydrogen-high", "reviewer-grok-4.7"]
