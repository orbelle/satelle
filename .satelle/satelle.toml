# This repo's satelle settings (kernel schema). An unknown key refuses to run.

[workflows]
default = "delivery"

# First match wins.
[[workflows.rule]]
workflow = "runbook"
kind = "execution"

[[workflows.rule]]
workflow = "standing"
kind = "task"

[[workflows.rule]]
workflow = "standing"
kind = "queue"

[[workflows.rule]]
workflow = "epic"
tag = "epic"

# A drift story (scripts/drift-stories.sh) is a record that closes only on a
# drift run's evidence; before chore, since a .satelle/ finding is a chore too.
[[workflows.rule]]
workflow = "drift"
kind = "story"
tag = "drift"

[[workflows.rule]]
workflow = "chore"
category = "chore"

[gate]
edit_exempt_paths = [".satelle/**", ".claude/**", ".grok/**", ".gitignore"]

[hook]
inject = [".satelle/principles/satelle-agent-goals.md", ".satelle/principles/satelle-operator-rulings.md"]

[rules]
reviewer_differs_from_performer = true
