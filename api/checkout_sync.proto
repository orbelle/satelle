// Checkout-sync gRPC contract (epic:checkout-sync, sty_7ece3dc3).
//
// Canonical definition of service Sync. satelle-server copies this proto
// verbatim (same posture as testdata/openapi.yaml) and implements it. This
// repo publishes the contract; it does not implement the server.
//
// Subscribe is deliberately out of scope (a later story). Do not add it here.
// Browser login (authorization_code) stays on HTTP /oauth/*. Token refresh on
// the sync path is Sync.Refresh — the RPC must not require a valid bearer;
// the refresh token in the request is the credential.
//
// record fields carry UTF-8 JSON (the opaque CLI work-item / ledger payload);
// the server may promote fields from them, matching REST json.RawMessage.
//
// Unary Sync messages are capped at 64 MiB (67108864 bytes) in each direction.
// The CLI sets MaxCallRecvMsgSize / MaxCallSendMsgSize accordingly; satelle-server
// should set MaxRecvMsgSize / MaxSendMsgSize to match. Snapshot's unpaged form
// (page_size 0) still rides in one message; paging (page_size > 0) bounds each
// response.

syntax = "proto3";

package satelle.sync.v1;

option go_package = "github.com/bobmcallan/satelle/api;api";

service Sync {
  rpc Apply(ApplyRequest) returns (ApplyResponse);
  rpc Snapshot(SnapshotRequest) returns (SnapshotResponse);
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
}

message ApplyRequest {
  string project = 1;
  repeated WorkItem items = 2;
  repeated LedgerEntry ledger = 3;
  repeated RunOutput outputs = 4;
}

message ApplyResponse {
  int32 items = 1;
  int32 ledger = 2;
  int32 outputs = 3; // outputs written
}

// Run outputs (satelle-server sty_0256bfe4): the run-output documents of
// executions in the batch or already in the project. Each needs an execution
// and a name. A body over 1 MiB, or an unknown execution, is INVALID_ARGUMENT
// and nothing of the batch is stored.
message RunOutput {
  string execution = 1;
  string name = 2;
  bytes body = 3;
}

// Paging and since-cursors (field numbers shared with satelle-server
// sty_8d5f91d0; this repo sty_70ba9615).
// page_size 0 keeps the unpaged contract: the whole result in one message.
// page_size > 0 returns at most that many items AND at most that many ledger
// rows per response (the server caps it), plus next_page_token until the
// pass is complete. The last response of a pass (and every unpaged response)
// carries sync_token; send it as since_token on the next pass to receive only
// rows changed since this pass began. A repeated row is possible, a missed
// row is not. Tokens are opaque.
//
// Story scoping (satelle-server sty_1a1f65e5; this repo sty_991b6900): a
// non-empty story_ids limits the pass to the work items with those ids and the
// ledger rows whose story_id is one of them. Paging, page tokens and
// since-cursors behave as for an unscoped pass; send the same story_ids with
// every page and with since_token. The server does not expand an epic: the
// client names the container and its member stories.
message SnapshotRequest {
  string project = 1;
  string kind = 2; // optional filter (story|execution)
  int32 page_size = 3;
  string page_token = 4;  // next_page_token from the previous page of this pass
  string since_token = 5; // sync_token from a previous pass
  repeated string story_ids = 6; // optional scope: at most 1000, none empty
}

message SnapshotResponse {
  repeated WorkItem items = 1;
  repeated LedgerEntry ledger = 2;
  string next_page_token = 3; // empty on the last page of a pass
  string sync_token = 4;      // set on the last page of a pass
}

message WorkItem {
  string id = 1;
  string kind = 2;
  string type = 3;
  string status = 4;
  string title = 5;
  string origin = 6;
  bytes record = 7;
}

message LedgerEntry {
  string id = 1;
  string story_id = 2;
  string kind = 3;
  string type = 4;
  string origin = 5;
  bytes record = 6;
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}
