version: v2
managed:
  enabled: true
  override:
    - file_option: go_package
      value: github.com/bobmcallan/satelle/internal/hosted/syncpb
inputs:
  - directory: api
plugins:
  - local: protoc-gen-go
    out: internal/hosted/syncpb
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/hosted/syncpb
    opt: paths=source_relative
