name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          check-latest: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: unit tests
        # The hermetic unit suite (credguard + scripts/hermetic.sh + go test ./...),
        # plain mode: STRICT=1 stays local-only (sty_a1f860b4).
        run: make test
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: no-cgo static build
        # Cover every main under cmd/ (CLI + satelled; sty_19ff03f4).
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/...
