name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          check-latest: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: windows cross-build
        run: GOOS=windows GOARCH=amd64 go build ./...
      - name: tests
        # go test ./... under credguard and scripts/hermetic.sh. It includes the
        # integration suite under tests/, which builds satelle and satelled once
        # and drives them in throwaway homes (docker-local skips without a daemon).
        run: make test TESTJSON=$RUNNER_TEMP/test.json
      - name: test timings
        # Each package's time, then the output of every test that failed or never
        # finished (the -json stream replaces the plain go test log).
        if: ${{ !cancelled() }}
        run: |
          f="$RUNNER_TEMP/test.json"
          [ -s "$f" ] || { echo "== $f: missing or empty"; exit 0; }
          jq -r 'select(.Test == null and (.Action == "pass" or .Action == "fail")) | "\(.Action)\t\(.Elapsed)s\t\(.Package)"' "$f"
          jq -rn 'reduce inputs as $e ({}; (($e.Package // $e.ImportPath // "") + " " + ($e.Test // "")) as $k
            | if $e.Action == "output" or $e.Action == "build-output" then .[$k] += ($e.Output // "")
              elif $e.Action == "pass" or $e.Action == "skip" then del(.[$k])
              else . end) | to_entries[] | .value' "$f"
      - name: upload test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-json
          path: ${{ runner.temp }}/test.json
          if-no-files-found: ignore
      - name: audit literals
        run: bash scripts/audit-literals.sh
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: no-cgo static build
        # Cover every main under cmd/ (CLI + satelled; sty_19ff03f4).
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/...
