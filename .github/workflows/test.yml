name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          check-latest: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: unit tests
        # The hermetic unit suite (credguard + scripts/hermetic.sh + go test ./...),
        # plain mode: STRICT=1 stays local-only (sty_a1f860b4).
        run: make test TESTJSON=$RUNNER_TEMP/unit.json
      - name: slow cli tests
        # The internal/cli tests behind the clislow tag, split out so neither step
        # nears go test's 10m package default (sty_210df6c3).
        if: ${{ !cancelled() }}
        run: make test-cli-slow TESTJSON_SLOW=$RUNNER_TEMP/cli-slow.json
      - name: test timings
        # Each package's time and the 40 slowest internal/cli tests, from the -json
        # streams above; then the output of every test that failed or never
        # finished (the streams replace the plain go test log).
        if: ${{ !cancelled() }}
        run: |
          for f in "$RUNNER_TEMP/unit.json" "$RUNNER_TEMP/cli-slow.json"; do
            [ -s "$f" ] || { echo "== $f: missing or empty"; continue; }
            echo "== $f: package times"
            jq -r 'select(.Test == null and (.Action == "pass" or .Action == "fail")) | "\(.Action)\t\(.Elapsed)s\t\(.Package)"' "$f"
            echo "== $f: slowest internal/cli tests (s)"
            jq -r 'select(.Package == "github.com/bobmcallan/satelle/internal/cli" and .Test != null and (.Test | contains("/") | not) and (.Action == "pass" or .Action == "fail")) | "\(.Elapsed)\t\(.Action)\t\(.Test)"' "$f" | sort -rn | head -40
            echo "== $f: output of failed or unfinished tests"
            jq -rn 'reduce inputs as $e ({}; (($e.Package // $e.ImportPath // "") + " " + ($e.Test // "")) as $k
              | if $e.Action == "output" or $e.Action == "build-output" then .[$k] += ($e.Output // "")
                elif $e.Action == "pass" or $e.Action == "skip" then del(.[$k])
                else . end) | to_entries[] | .value' "$f"
          done
      - name: upload test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-json
          path: |
            ${{ runner.temp }}/unit.json
            ${{ runner.temp }}/cli-slow.json
          if-no-files-found: ignore
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: no-cgo static build
        # Cover every main under cmd/ (CLI + satelled; sty_19ff03f4).
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/...
