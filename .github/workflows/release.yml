name: release

# .version is canonical: satelle.version (CLI) and satelled.version are
# independent (sty_19ff03f4 / sty_bd9de06d). CLI releases use tag v<cli> and
# remain GitHub "latest". Daemon releases use tag serve-v<serve> (prefix kept
# so older installed CLIs still discover the channel) with --latest=false so
# installed CLI self-update keeps resolving releases/latest correctly.
#
# Releases run only when asked (workflow_dispatch, by the CI/CD task after its
# local tests pass); a push to main publishes nothing. GitHub runs no tests:
# they run locally, then on remotes (operator, 2026-11-06).
on:
  workflow_dispatch:

permissions:
  contents: write   # tag push + gh release create

jobs:
  derive-tag:
    name: derive release tags from .version
    runs-on: ubuntu-latest
    outputs:
      cli_version: ${{ steps.read.outputs.cli_version }}
      serve_version: ${{ steps.read.outputs.serve_version }}
      build: ${{ steps.read.outputs.build }}
      cli_tag: ${{ steps.read.outputs.cli_tag }}
      serve_tag: ${{ steps.read.outputs.serve_tag }}
      needs_cli: ${{ steps.check.outputs.needs_cli }}
      needs_serve: ${{ steps.check.outputs.needs_serve }}
      needs_release: ${{ steps.check.outputs.needs_release }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: read
        run: |
          set -euo pipefail
          CLI=$(awk '$1=="satelle.version:" {print $2}' .version)
          SERVE=$(awk '$1=="satelled.version:" {print $2}' .version)
          BUILD=$(awk '$1=="satelle.build:" {print $2}' .version)
          [ -n "$CLI" ] || { echo "satelle.version missing" >&2; exit 1; }
          [ -n "$SERVE" ] || { echo "satelled.version missing" >&2; exit 1; }
          [ -n "$BUILD" ] || { echo "satelle.build missing" >&2; exit 1; }
          echo "cli_version=$CLI"     >> "$GITHUB_OUTPUT"
          echo "serve_version=$SERVE" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD"         >> "$GITHUB_OUTPUT"
          echo "cli_tag=v$CLI"        >> "$GITHUB_OUTPUT"
          echo "serve_tag=serve-v$SERVE" >> "$GITHUB_OUTPUT"
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CLI_TAG="${{ steps.read.outputs.cli_tag }}"
          SERVE_TAG="${{ steps.read.outputs.serve_tag }}"
          needs_cli=false
          needs_serve=false
          if ! git rev-parse -q --verify "refs/tags/$CLI_TAG" >/dev/null; then
            needs_cli=true
            echo "::notice::CLI tag $CLI_TAG missing — will release CLI"
          else
            echo "::notice::CLI tag $CLI_TAG exists — skip CLI release"
          fi
          # Key the serve decision on a PUBLISHED RELEASE, not a bare tag
          # (sty_0dcedb0d). A tag pushed by a run that failed before
          # `gh release create` would otherwise block that serve version's
          # release forever, with nothing for `satelle update` to install.
          if gh release view "$SERVE_TAG" --json tagName >/dev/null 2>&1; then
            echo "::notice::serve release $SERVE_TAG published — skip serve release"
          else
            needs_serve=true
            echo "::notice::serve release $SERVE_TAG not published — will release serve"
          fi
          echo "needs_cli=$needs_cli" >> "$GITHUB_OUTPUT"
          echo "needs_serve=$needs_serve" >> "$GITHUB_OUTPUT"
          if [ "$needs_cli" = true ] || [ "$needs_serve" = true ]; then
            echo "needs_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build ${{ matrix.artifact }} ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: derive-tag
    if: needs.derive-tag.outputs.needs_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { artifact: satelle,       pkg: ./cmd/satelle,       goos: linux,   goarch: amd64, validate: true  }
          - { artifact: satelle,       pkg: ./cmd/satelle,       goos: linux,   goarch: arm64, validate: false }
          - { artifact: satelle,       pkg: ./cmd/satelle,       goos: darwin,  goarch: amd64, validate: false }
          - { artifact: satelle,       pkg: ./cmd/satelle,       goos: darwin,  goarch: arm64, validate: false }
          - { artifact: satelle,       pkg: ./cmd/satelle,       goos: windows, goarch: amd64, validate: false }
          - { artifact: satelled, pkg: ./cmd/satelled, goos: linux,   goarch: amd64, validate: true  }
          - { artifact: satelled, pkg: ./cmd/satelled, goos: linux,   goarch: arm64, validate: false }
          - { artifact: satelled, pkg: ./cmd/satelled, goos: darwin,  goarch: amd64, validate: false }
          - { artifact: satelled, pkg: ./cmd/satelled, goos: darwin,  goarch: arm64, validate: false }
          - { artifact: satelled, pkg: ./cmd/satelled, goos: windows, goarch: amd64, validate: false }
    steps:
      - name: skip if artifact not releasing
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ matrix.artifact }}" = "satelle" ] && [ "${{ needs.derive-tag.outputs.needs_cli }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.artifact }}" = "satelled" ] && [ "${{ needs.derive-tag.outputs.needs_serve }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        if: steps.gate.outputs.skip != 'true'
        with:
          go-version: '1.27'
          check-latest: true
      - name: build
        if: steps.gate.outputs.skip != 'true'
        env:
          GOOS:    ${{ matrix.goos }}
          GOARCH:  ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          CLI_VER:   ${{ needs.derive-tag.outputs.cli_version }}
          SERVE_VER: ${{ needs.derive-tag.outputs.serve_version }}
          BUILD:     ${{ needs.derive-tag.outputs.build }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.artifact }}" = "satelle" ]; then
            VER="$CLI_VER"
          else
            VER="$SERVE_VER"
          fi
          OUT="${{ matrix.artifact }}-v${VER}-${GOOS}-${GOARCH}"
          [ "$GOOS" = "windows" ] && OUT="${OUT}.exe"
          # Name stamps per-artifact footer/version brand (sty_4a5c6924).
          ART_NAME="${{ matrix.artifact }}"
          go build -trimpath \
            -ldflags="-s -w \
              -X github.com/bobmcallan/satelle/internal/buildinfo.Name=${ART_NAME} \
              -X github.com/bobmcallan/satelle/internal/buildinfo.Version=${VER} \
              -X github.com/bobmcallan/satelle/internal/buildinfo.Commit=${BUILD_SHA} \
              -X github.com/bobmcallan/satelle/internal/buildinfo.BuildTime=${BUILD}" \
            -o "${OUT}" "${{ matrix.pkg }}"
          sha256sum "${OUT}" > "${OUT}.sha256"
          echo "OUT=${OUT}" >> "$GITHUB_ENV"
          # Namespace by role, not artifact prefix: dist-satelle-* would also
          # match dist-satelled-* (satelled starts with satelle).
          if [ "${{ matrix.artifact }}" = "satelle" ]; then
            echo "ART=dist-cli-${GOOS}-${GOARCH}" >> "$GITHUB_ENV"
          else
            echo "ART=dist-serve-${GOOS}-${GOARCH}" >> "$GITHUB_ENV"
          fi
      - name: validate (linux/amd64)
        if: steps.gate.outputs.skip != 'true' && matrix.validate
        run: |
          set -euo pipefail
          if [ "${{ matrix.artifact }}" = "satelle" ]; then
            ./"${OUT}" version
          else
            ./"${OUT}" --version
          fi
      - uses: actions/upload-artifact@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          name: ${{ env.ART }}
          path: |
            ${{ env.OUT }}
            ${{ env.OUT }}.sha256
          if-no-files-found: error

  release-cli:
    name: tag + publish CLI release
    needs: [derive-tag, build]
    if: needs.derive-tag.outputs.needs_cli == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
          pattern: dist-cli-*
      - name: verify checksums
        run: |
          set -euo pipefail
          cd artifacts
          for sum in satelle-v*.sha256; do sha256sum -c "${sum}"; done
      - name: stage installer bootstrap
        run: cp scripts/install.sh artifacts/install.sh
      - name: tag + release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.derive-tag.outputs.cli_tag }}
          VER: ${{ needs.derive-tag.outputs.cli_version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release CLI $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "satelle CLI v${VER}

          Install:
          \`\`\`
          curl -fsSL https://github.com/bobmcallan/satelle/releases/latest/download/install.sh | sh
          \`\`\`" \
            artifacts/*

  release-serve:
    name: tag + publish serve release
    needs: [derive-tag, build]
    if: needs.derive-tag.outputs.needs_serve == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
          pattern: dist-serve-*
      - name: verify checksums
        run: |
          set -euo pipefail
          cd artifacts
          for sum in satelled-*.sha256; do sha256sum -c "${sum}"; done
      - name: tag + release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.derive-tag.outputs.serve_tag }}
          VER: ${{ needs.derive-tag.outputs.serve_version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Idempotent tagging: this job now runs when the RELEASE is missing,
          # which includes the case where a previous run pushed the tag and then
          # failed. Re-tagging would abort under `set -e` and the release would
          # never be created, so create the tag only when it is absent
          # (sty_0dcedb0d).
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::notice::tag $TAG already exists — publishing the release onto it"
          else
            git tag -a "$TAG" -m "Release serve $TAG"
            git push origin "$TAG"
          fi
          # --latest=false keeps releases/latest on the CLI (install/update contract).
          gh release create "$TAG" \
            --title "$TAG" \
            --latest=false \
            --notes "satelled v${VER} (local-tier daemon — push-fed mirror UI)" \
            artifacts/*
